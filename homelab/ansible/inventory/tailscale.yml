---
tailscale_netstate: "{{ lookup('ansible.builtin.pipe', 'tailscale status --json') | from_json }}"
tailscale_names:
  proxmox_host: proxmox
  shared: div
tailscale_peer: >-
  {{ tailscale_netstate.Peer.values()
     | selectattr('HostName', 'equalto', tailscale_names.get(inventory_hostname, inventory_hostname))
     | first }}
ansible_host: "{{ tailscale_peer.DNSName }}"
ansible_ssh_common_args: >-
  -o ProxyCommand='tailscale nc %h %p'
  -o StrictHostKeyChecking=accept-new
