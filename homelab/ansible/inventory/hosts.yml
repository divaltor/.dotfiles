---
# Ansible inventory — Proxmox infrastructure on divaltor-dc
# Hosts default to Avahi mDNS records. Override *_ansible_host vars with
# temporary IPs during first bootstrap before Avahi is installed.

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  hosts:
    proxmox_host:
      ansible_host: "{{ proxmox_ansible_host | default('proxmox.local') }}"
      ansible_user: root
  children:
    vms:
      hosts:
        homelab:
          ansible_host: "{{ homelab_ansible_host | default('homelab.local') }}"
          ansible_user: root
        shared:
          ansible_host: "{{ shared_ansible_host | default('div.local') }}"
          ansible_user: root
          ansible_python_interpreter: /run/current-system/sw/bin/python3
    containers:
      hosts:
        smb:
          ansible_host: "{{ smb_ansible_host | default('smb.local') }}"
          ansible_user: root
          lxc_vmid: 101
        kino:
          ansible_host: "{{ kino_ansible_host | default('kino.local') }}"
          ansible_user: root
          lxc_vmid: 102
        qbittorrent:
          ansible_host: "{{ qbittorrent_ansible_host | default('qbittorrent.local') }}"
          ansible_user: root
          lxc_vmid: 103
        sftpgo:
          ansible_host: "{{ sftpgo_ansible_host | default('sftpgo.local') }}"
          ansible_user: root
          lxc_vmid: 105
