---
# ============================================================
# Proxmox host bootstrap and service configuration
# ============================================================
# Runs against the Proxmox VE host (192.168.1.19).
# Imports and validates the existing VM and HDD ZFS pools, registers Proxmox
# storage, configures the iGPU resource mapping, and manages host services.
# Pool creation and disk wiping are deliberately not managed here.
# ============================================================

- name: Configure Proxmox host
  hosts: proxmox_host
  gather_facts: true
  become: false
  vars_files:
    - ../group_vars/all.yml

  roles:
    - ssh
    - proxmox_repositories
    - role: proxmox_storage
      tags: [proxmox_bootstrap]
    - role: proxmox_pci_mapping
      tags: [proxmox_bootstrap]
    - role: tailscale
      vars:
        tailscale_hostname: proxmox
    - role: zfs
      tags: [zfs]
    - role: node_exporter
      tags: [node_exporter]
      vars:
        node_exporter_enable_disk_health_collectors: true
    - role: avahi
      vars:
        avahi_hostname: proxmox
        avahi_allow_interfaces: vmbr0
    - role: caddy_proxy
      vars:
        caddy_proxy_server_name: proxmox.local
        caddy_proxy_upstream: https://127.0.0.1:8006
