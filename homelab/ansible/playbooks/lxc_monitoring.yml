---
# ============================================================
# LXC: monitoring (106) — Prometheus, Grafana, and exporters
# ============================================================

- import_playbook: lxc_bootstrap.yml
  vars:
    lxc_bootstrap_targets:
      - monitoring

- name: Configure monitoring LXC
  hosts: monitoring
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  roles:
    - ssh
    - common
    - role: auto_updates
      tags: [auto_updates]
      vars:
        # Keep the versions pinned in group_vars; Grafana itself still updates.
        auto_updates_package_blacklist: [alloy, loki, tempo]
    - role: node_exporter
      tags: [node_exporter]
      vars:
        # LXC diskstats are host-wide and would duplicate the real host target.
        node_exporter_disabled_collectors: [diskstats, zfs]
    - monitoring
    - role: caddy_proxy
      vars:
        caddy_proxy_server_name: monitoring.local
        caddy_proxy_upstream: http://127.0.0.1:3000
    - avahi
