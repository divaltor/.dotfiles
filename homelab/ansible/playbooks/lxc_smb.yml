---
# ============================================================
# LXC: smb (101) — Samba file server + Avahi mDNS
# ============================================================
# The container runs Debian with Samba sharing ZFS-backed
# HDD storage and disposable SSD downloads from the Proxmox host via bind mounts.
# ============================================================

- import_playbook: lxc_bootstrap.yml
  vars:
    lxc_bootstrap_targets:
      - smb

- name: Configure Samba LXC
  hosts: smb
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  roles:
    - ssh
    - common
    - role: node_exporter
      tags: [node_exporter]
      vars:
        node_exporter_disabled_collectors: [diskstats, zfs]
    - tailscale
    - role: samba
    - role: avahi
      vars:
        avahi_samba_advertise: true
