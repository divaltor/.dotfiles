---
# ============================================================
# LXC bootstrap — install root SSH key through Proxmox host
# ============================================================
# Runs before direct container SSH is available. Proxmox can enter
# containers with pct exec, so use it to seed authorized_keys.
# ============================================================

- name: Bootstrap LXC SSH access
  hosts: proxmox_host
  gather_facts: false
  become: false
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Ensure SSH public key is provided
      ansible.builtin.assert:
        that:
          - ssh_public_key | length > 0
        fail_msg: "TF_VAR_ssh_public_key is not set"

    - name: Install root SSH key in LXC containers
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ hostvars[item].lxc_vmid | string }}"
          - --
          - env
          - "SSH_PUBLIC_KEY={{ ssh_public_key }}"
          - sh
          - -c
          - |
            set -eu
            mkdir -p /root/.ansible/tmp
            chmod 700 /root/.ansible /root/.ansible/tmp
            mkdir -p /root/.ssh
            touch /root/.ssh/authorized_keys
            if grep -qxF "$SSH_PUBLIC_KEY" /root/.ssh/authorized_keys; then
              echo unchanged
            else
              printf '%s\n' "$SSH_PUBLIC_KEY" >> /root/.ssh/authorized_keys
              echo changed
            fi
            chmod 700 /root/.ssh
            chmod 600 /root/.ssh/authorized_keys
      loop: "{{ lxc_bootstrap_targets | default(groups['containers']) }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item].lxc_vmid }})"
      register: lxc_bootstrap_authorized_key
      changed_when: lxc_bootstrap_authorized_key.stdout == 'changed'

    - name: Discover LXC DHCP addresses
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ hostvars[item].lxc_vmid | string }}"
          - --
          - sh
          - -c
          - ip -4 -o address show dev eth0 scope global | tr -s ' ' | cut -d ' ' -f4 | cut -d/ -f1 | head -n1
      loop: "{{ lxc_bootstrap_targets | default(groups['containers']) }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item].lxc_vmid }})"
      register: lxc_bootstrap_addresses
      changed_when: false
      until: lxc_bootstrap_addresses.stdout | length > 0
      retries: 12
      delay: 5

    - name: Read LXC SSH host keys through Proxmox
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ hostvars[item].lxc_vmid | string }}"
          - --
          - cat
          - /etc/ssh/ssh_host_ed25519_key.pub
      loop: "{{ lxc_bootstrap_targets | default(groups['containers']) }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item].lxc_vmid }})"
      register: lxc_bootstrap_host_keys
      changed_when: false

    - name: Create known-hosts file for discovered LXC addresses
      ansible.builtin.tempfile:
        state: file
        prefix: ansible-lxc-known-hosts-
      delegate_to: localhost
      register: lxc_bootstrap_known_hosts

    - name: Trust LXC host keys obtained through Proxmox
      ansible.builtin.known_hosts:
        path: "{{ lxc_bootstrap_known_hosts.path }}"
        name: "{{ lxc_bootstrap_addresses.results[lxc_bootstrap_index].stdout }}"
        key: "{{ lxc_bootstrap_addresses.results[lxc_bootstrap_index].stdout }} {{ item.stdout }}"
      loop: "{{ lxc_bootstrap_host_keys.results }}"
      loop_control:
        index_var: lxc_bootstrap_index
        label: "{{ item.item }} ({{ lxc_bootstrap_addresses.results[lxc_bootstrap_index].stdout }})"
      delegate_to: localhost

    - name: Use discovered addresses for this playbook run
      ansible.builtin.add_host:
        name: "{{ item.item }}"
        ansible_host: "{{ item.stdout }}"
        ansible_ssh_common_args: "-o UserKnownHostsFile={{ lxc_bootstrap_known_hosts.path }}"
      loop: "{{ lxc_bootstrap_addresses.results }}"
      loop_control:
        label: "{{ item.item }} ({{ item.stdout }})"
      when: item.stdout | length > 0
