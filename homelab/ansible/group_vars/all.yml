---
# Group variables — all hosts

# Proxmox host identity and storage. Pools must already exist on disk; Ansible
# imports and validates them but never creates a pool or wipes a device.
proxmox_node_name: divaltor-dc
proxmox_host_address: 192.168.1.19
proxmox_system_disk_by_id: /dev/disk/by-id/nvme-Samsung_SSD_970_EVO_Plus_500GB_S4EVNX0T102553F
proxmox_vm_disk_by_id: /dev/disk/by-id/nvme-WD_BLACK_SN850X_4000GB_252639802020
proxmox_vm_pool_name: vmdata
proxmox_vm_pool_mountpoint: /vmdata
proxmox_vm_storage_id: fast-nvme
proxmox_vm_storage_blocksize: 16k
proxmox_vm_datasets:
  - name: vmdata/qbittorrent
    mountpoint: /vmdata/qbittorrent
    quota: 1T
    recordsize: 1M
proxmox_lxc_bind_mounts:
  - vmid: 101
    key: mp1
    volume: /vmdata/qbittorrent
    path: /mnt/ssd-downloads
  - vmid: 103
    key: mp1
    volume: /vmdata/qbittorrent
    path: /media/ssd/downloads

# The physical BDF can change when PCIe devices are added. Guests use this
# logical Proxmox mapping; only this host-side mapping needs the current BDF.
proxmox_gpu_mapping_id: amd-igpu
proxmox_gpu_pci_address: "0000:c6:00.0"
proxmox_gpu_device_id: "1002:150e"
proxmox_gpu_subsystem_id: "1f4c:b020"
proxmox_gpu_vbios_path: /usr/share/kvm/strix-gfx1150.rom
proxmox_gpu_vbios_sha256: ee1aa9f76168cc9ac1318102fa60bfe72e371741877a4b83898d8d8110e3ecbf

# HDD ZFS pool configuration (managed on Proxmox host)
zfs_pool_name: pool
zfs_pool_mountpoint: /media

# ZFS datasets (existing layout; the pool root itself is mounted at /media/cold)
zfs_datasets:
  - name: pool
    mountpoint: /media/cold
    # Shared to LXC 101 (smb) via bind mount
  # - name: pool/media
  #   mountpoint: /media/media
  # - name: pool/backups
  #   mountpoint: /media/backups

# Samba configuration (LXC: smb only)
samba_workgroup: WORKGROUP
samba_netbios_name: divaos
samba_server_string: DivaOS
samba_interfaces: "eth0 lo"
samba_bind_interfaces_only: false
samba_map_to_guest: Never
samba_restrict_anonymous: 2
samba_vfs_objects: "catia fruit streams_xattr"
samba_fruit_model: RackMac
samba_unix_extensions: false

# Samba shares — adjust paths and permissions as needed
samba_shares:
  - name: storage
    path: /mnt/share
    browseable: true
    read_only: false
    inherit_permissions: false
    valid_users: divaltor
    force_user: divaltor
    create_mask: "0664"
    force_create_mode: "0664"
    directory_mask: "0775"
    force_directory_mode: "0775"
    owner: divaltor
    group: divaltor
  - name: ssd
    path: /mnt/ssd-downloads
    browseable: true
    read_only: false
    inherit_permissions: false
    valid_users: divaltor
    force_user: divaltor
    create_mask: "0664"
    force_create_mode: "0664"
    directory_mask: "0775"
    force_directory_mode: "0775"
    owner: divaltor
    group: divaltor

samba_users:
  - name: divaltor
    password: "{{ lookup('env', 'SAMBA_PASSWORD') | default(lookup('env', 'TF_VAR_samba_password'), true) }}"

# Stable numeric group shared by the privileged Samba and SFTPGo LXCs. Files
# created through either protocol remain writable through the other one.
zfs_share_group: zfs-share
zfs_share_gid: 2000

# qBittorrent uses the SSD-backed dataset shared with Samba. Bind mounts are
# excluded from Proxmox guest backups; this disposable download data stays so.
qbittorrent_download_path: /media/ssd/downloads

# SFTPGo (LXC: sftpgo only)
sftpgo_version: 2.7.5
sftpgo_deb_sha256: 05997f84cc7b0d4b0b21777b56468c727168c6a40fa9eb17dd9ce4a9e1e0f1b6
sftpgo_storage_path: /mnt/share
sftpgo_webclient_port: 8081
sftpgo_webdav_port: 10080
sftpgo_webdav_funnel_port: 8443
sftpgo_funnel_enabled: true
sftpgo_installation_code: "{{ lookup('env', 'SFTPGO_INSTALLATION_CODE') }}"

# Avahi / mDNS
avahi_enable: true
avahi_hostname: "{{ inventory_hostname }}"
avahi_allow_interfaces: eth0
avahi_publish_workstation: true
avahi_reflector: false
avahi_samba_advertise: false
avahi_samba_service_name: DivaOS
avahi_samba_device_model: TimeCapsule
avahi_aliases: []

# Caddy reverse proxy
caddy_proxy_server_name: "{{ avahi_hostname }}.local"
caddy_proxy_upstream: https://127.0.0.1:8006

# Monitoring stack (LXC: monitoring only)
node_exporter_port: 9100
monitoring_prometheus_port: 9090
monitoring_grafana_port: 3000
monitoring_pve_exporter_port: 9221
monitoring_prometheus_retention_time: 180d
monitoring_prometheus_retention_size: 100GB
monitoring_pve_exporter_version: 3.9.0
monitoring_pve_target: divaltor-dc.local
monitoring_pve_user: prometheus@pve
monitoring_pve_token_name: monitoring
monitoring_pve_token_value: "{{ lookup('env', 'PVE_MONITORING_TOKEN') }}"
monitoring_grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
monitoring_node_exporter_targets:
  - name: proxmox
    address: proxmox.local:9100
    role: hypervisor
  - name: homelab
    address: homelab.local:9100
    role: vm
  - name: smb
    address: smb.local:9100
    role: lxc
  - name: kino
    address: kino.local:9100
    role: lxc
  - name: qbittorrent
    address: qbittorrent.local:9100
    role: lxc
  - name: sftpgo
    address: sftpgo.local:9100
    role: lxc
  - name: monitoring
    address: monitoring.local:9100
    role: lxc
monitoring_cadvisor_targets:
  - name: homelab
    address: "homelab.local:{{ cadvisor_port }}"
    role: vm
monitoring_grafana_community_dashboards:
  - name: Node Exporter Full
    file: node-exporter-full.json
    url: https://grafana.com/api/dashboards/1860/revisions/45/download
    checksum: sha256:184c6b7409f306da75525d7772f71945b10cea23ad16b5d78c4698ea0ea51986
  - name: Proxmox via Prometheus
    file: proxmox-via-prometheus.json
    url: https://grafana.com/api/dashboards/10347/revisions/1/download
    checksum: sha256:c336993662c26a5c706b22092527dbf0d77b46ec21bcbe227004ea17dfd1fbbd
  - name: ZFS Pool Performance and Health
    file: zfs-pool-performance-and-health.json
    url: https://grafana.com/api/dashboards/24987/revisions/2/download
    checksum: sha256:460d5c8f678190dfbf8d6a6e085dfb24d00503fd8fca093726b6d17bcacd15ca
  - name: Prometheus Self-Monitoring
    file: prometheus-self-monitoring.json
    url: https://grafana.com/api/dashboards/25537/revisions/1/download
    checksum: sha256:964e8674a6e5bab7980acc42b2eb6bb4c958ace4fa9d79b3d9e290b1ad96cc87
monitoring_grafana_local_dashboards:
  - name: Docker Container Advanced
    file: docker-container-advanced.json
    src: docker-container-advanced.json
monitoring_grafana_managed_dashboards: >-
  {{ monitoring_grafana_community_dashboards + monitoring_grafana_local_dashboards }}

# cAdvisor runs only on the VM that hosts Docker workloads.
cadvisor_image: ghcr.io/google/cadvisor@sha256:1eb9bde04dab65b919bc51da9e7cf8eceb40d57e61ac9e93e373100369d90cd6
cadvisor_port: 8080

# qBittorrent
qbittorrent_webui_password: "{{ lookup('env', 'QBITTORRENT_PASSWORD') }}"

# Tailscale
tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') | default(lookup('env', 'TF_VAR_tailscale_auth_key'), true) }}"
tailscale_hostname: "{{ inventory_hostname }}"
tailscale_apt_distribution: "{{ 'debian' if ansible_facts['os_family'] == 'Debian' else ansible_facts['distribution'] | lower }}"
tailscale_apt_release: "{{ ansible_facts['distribution_release'] }}"
tailscale_up_args:
  - --advertise-tags=tag:homelab

# Common packages
common_packages:
  - vim
  - curl
  - wget
  - htop
  - tmux
  - net-tools
  - ca-certificates
  - gnupg

# SSH bootstrap
ssh_authorized_user: root
ssh_public_key: "{{ lookup('env', 'TF_VAR_ssh_public_key') }}"
ssh_public_keys:
  - "{{ ssh_public_key }}"
