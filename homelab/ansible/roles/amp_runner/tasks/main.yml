---
- name: Create unprivileged Amp runner user
  ansible.builtin.user:
    name: amp
    comment: Amp Runner
    create_home: true
    shell: /bin/bash

- name: Authorize operator SSH keys for Amp user
  ansible.posix.authorized_key:
    user: amp
    key: "{{ item }}"
    state: present
  loop: "{{ ssh_public_keys }}"
  no_log: true

- name: Require an SSH private commit-signing key
  ansible.builtin.assert:
    that:
      - amp_signing_key.startswith('-----BEGIN OPENSSH PRIVATE KEY-----')
      - amp_signing_key.splitlines() | length > 2
      - amp_signing_key.rstrip().endswith('-----END OPENSSH PRIVATE KEY-----')
    fail_msg: AMP_SIGNING_KEY must contain a multiline OpenSSH private key
  no_log: true

- name: Install Amp commit-signing key
  ansible.builtin.copy:
    content: "{{ amp_signing_key }}\n"
    dest: /home/amp/.ssh/commit_signing_key
    owner: amp
    group: amp
    mode: "0600"
  no_log: true

- name: Configure Git to sign commits with SSH
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  become: true
  become_user: amp
  loop:
    - name: gpg.format
      value: ssh
    - name: user.signingkey
      value: /home/amp/.ssh/commit_signing_key
    - name: commit.gpgsign
      value: "true"

- name: Create runner workspaces
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: amp
    group: amp
    mode: "0755"
  loop:
    - /workspace/personal
    - /workspace/work

- name: Install NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /usr/share/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"

- name: Enable current Node.js LTS repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: [deb]
    uris: https://deb.nodesource.com/node_24.x
    suites: [nodistro]
    components: [main]
    signed_by: /usr/share/keyrings/nodesource.asc
    state: present

- name: Install Orb-compatible system tools
  ansible.builtin.apt:
    name:
      - chromium
      - ffmpeg
      - fzf
      - gh
      - git
      - imagemagick
      - jq
      - lsof
      - nodejs
      - openssh-client
      - pipx
      - python3
      - python3-pip
      - qemu-guest-agent
      - ripgrep
      - sudo
      - tmux
      - unzip
      - vim
      - zstd
    state: latest
    update_cache: true

- name: Allow Amp user passwordless sudo
  ansible.builtin.copy:
    content: "amp ALL=(ALL:ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/amp
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Enable lingering for Amp user
  ansible.builtin.command: loginctl enable-linger amp
  args:
    creates: /var/lib/systemd/linger/amp

- name: Install websocat
  ansible.builtin.get_url:
    url: "https://github.com/vi/websocat/releases/download/v{{ websocat_version }}/websocat.x86_64-unknown-linux-musl"
    dest: /usr/local/bin/websocat
    checksum: "sha256:{{ websocat_sha256 }}"
    owner: root
    group: root
    mode: "0755"

- name: Install current JavaScript agent tools
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
  become: true
  become_user: amp
  environment:
    NPM_CONFIG_PREFIX: /home/amp/.local
  loop:
    - "@ampcode/cli"
    - "@opencode/cli"
    - agent-browser
    - bun
    - pnpm
    - yarn

- name: Install current uv for Amp user
  community.general.pipx:
    name: uv
    state: latest
  become: true
  become_user: amp

- name: Require Amp access token
  ansible.builtin.assert:
    that: amp_api_key | length > 0
    fail_msg: Add AMP_API_KEY to the 1Password environment before applying the Opera playbook
  no_log: true

- name: Store Amp runner credentials
  ansible.builtin.copy:
    content: |
      AMP_API_KEY={{ amp_api_key }}
      {% if amp_github_token | length > 0 %}
      GH_TOKEN={{ amp_github_token }}
      {% endif %}
    dest: /etc/amp-runner.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Amp runner

- name: Enable QEMU guest agent
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: Install Amp runner service
  ansible.builtin.template:
    src: amp-runner.service.j2
    dest: /etc/systemd/system/amp-runner.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Amp runner

- name: Enable and start Amp runner
  ansible.builtin.systemd_service:
    name: amp-runner
    enabled: true
    state: started
    daemon_reload: true
