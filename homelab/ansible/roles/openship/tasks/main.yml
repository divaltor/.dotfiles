---
- name: Require OpenShip administrator credentials
  ansible.builtin.assert:
    that:
      - openship_admin_name | length > 0
      - openship_admin_email is match('^[^@]+@[^@]+$')
      - openship_admin_password | length >= 8
      - openship_admin_password | length <= 128
    fail_msg: >-
      Add OPENSHIP_ADMIN_PASSWORD (8-128 characters) to the 1Password
      environment used by mise.
  no_log: true

- name: Download the pinned OpenShip installer
  ansible.builtin.get_url:
    url: https://get.openship.io
    dest: "/var/cache/openship-install-{{ openship_version }}.sh"
    checksum: "sha256:{{ openship_installer_sha256 }}"
    owner: root
    group: root
    mode: "0700"

- name: Install the pinned OpenShip CLI
  ansible.builtin.command:
    argv:
      - /bin/sh
      - "/var/cache/openship-install-{{ openship_version }}.sh"
    creates: "/root/.openship/cli/v{{ openship_version }}/.extracted"
  environment:
    OPENSHIP_VERSION: "{{ openship_version }}"
  notify: Restart OpenShip

- name: Install OpenShip systemd service
  ansible.builtin.template:
    src: openship.service.j2
    dest: /etc/systemd/system/openship.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload OpenShip systemd unit
    - Restart OpenShip

- name: Ensure OpenShip is running
  ansible.builtin.systemd_service:
    name: openship
    state: started
    enabled: true
    daemon_reload: true

- name: Apply OpenShip configuration before bootstrapping the administrator
  ansible.builtin.meta: flush_handlers

- name: Verify OpenShip API health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openship_api_port }}/api/health"
    status_code: 200
  register: openship_health
  until: openship_health.status == 200
  retries: 30
  delay: 2
  when: not ansible_check_mode

- name: Read OpenShip internal bootstrap token
  ansible.builtin.slurp:
    src: /root/.openship/internal-token
  register: openship_internal_token
  no_log: true
  when: not ansible_check_mode

- name: Create the founding OpenShip administrator
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openship_api_port }}/api/system/bootstrap-admin"
    method: POST
    headers:
      X-Internal-Token: "{{ openship_internal_token.content | b64decode | trim }}"
    body_format: json
    body:
      name: "{{ openship_admin_name }}"
      email: "{{ openship_admin_email }}"
      password: "{{ openship_admin_password }}"
    status_code:
      - 200
      - 409
    return_content: true
  register: openship_admin_bootstrap
  changed_when: openship_admin_bootstrap.status == 200
  failed_when: >-
    openship_admin_bootstrap.status not in [200, 409] or
    (openship_admin_bootstrap.status == 409 and
    (openship_admin_bootstrap.json.error | default('')) !=
    'An admin account already exists')
  no_log: true
  when: not ansible_check_mode
