---
- name: Install nftables
  ansible.builtin.package:
    name: nftables
    state: present

- name: Create nftables include directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Opera egress policy
  ansible.builtin.template:
    src: opera-egress.nft.j2
    dest: /etc/nftables.d/opera-egress.nft
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Install Opera egress firewall service
  ansible.builtin.template:
    src: opera-egress-firewall.service.j2
    dest: /etc/systemd/system/opera-egress-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Enable Opera egress firewall
  ansible.builtin.systemd_service:
    name: opera-egress-firewall
    enabled: true
    state: started
    daemon_reload: true
