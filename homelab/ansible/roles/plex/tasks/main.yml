---
# Plex role — install Plex Media Server from the official APT repository.

- name: Install Plex APT prerequisites
  ansible.builtin.package:
    name:
      - apt-transport-https
      - curl
    state: present

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add Plex APT signing key
  ansible.builtin.get_url:
    url: https://downloads.plex.tv/plex-keys/PlexSign.v2.key
    dest: /etc/apt/keyrings/plexmediaserver.v2.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Plex APT repository
  ansible.builtin.deb822_repository:
    name: plexmediaserver
    types: deb
    uris: https://repo.plex.tv/deb/
    suites: public
    components: main
    signed_by: /etc/apt/keyrings/plexmediaserver.v2.asc
    state: present
  register: plex_apt_repository

- name: Update APT cache after adding Plex repository
  ansible.builtin.apt:
    update_cache: true
  when: plex_apt_repository is changed

- name: Install Plex Media Server
  ansible.builtin.package:
    name: plexmediaserver
    state: present

- name: Ensure Plex Media Server is running
  ansible.builtin.service:
    name: plexmediaserver
    state: started
    enabled: true

- name: Wait for Plex preferences to be created
  ansible.builtin.wait_for:
    path: "{{ plex_preferences_path }}"
    timeout: 60

- name: Read Plex preferences
  ansible.builtin.slurp:
    src: "{{ plex_preferences_path }}"
  register: plex_preferences

- name: Determine which Plex preferences need editing
  ansible.builtin.set_fact:
    plex_preferences_need_lan_update: >-
      {{ ('allowedNetworks="' ~ plex_allowed_networks ~ '"') not in plex_preferences_xml
         or ('customConnections="' ~ plex_custom_connections ~ '"') not in plex_preferences_xml }}
    plex_preferences_need_claim: "{{ plex_claim_token | length > 0 and 'PlexOnlineToken=' not in plex_preferences_xml }}"
  vars:
    plex_preferences_xml: "{{ plex_preferences.content | b64decode }}"

# Stopping Plex interrupts playback, so stop it only when an edit is due.
- name: Stop Plex Media Server before editing preferences
  ansible.builtin.service:
    name: plexmediaserver
    state: stopped
  when: plex_preferences_need_lan_update or plex_preferences_need_claim

- name: Allow local LAN setup and advertise local Plex URL
  ansible.builtin.command:
    argv:
      - /usr/bin/perl
      - -0pi
      - -e
      - >-
        BEGIN { $allowed='{{ plex_allowed_networks }}'; $custom='{{ plex_custom_connections }}'; }
        s/\sallowedNetworks="[^"]*"//g;
        s/\scustomConnections="[^"]*"//g;
        s/<Preferences\b([^>]*)\/>/<Preferences$1 allowedNetworks="$allowed" customConnections="$custom"\/>/;
      - "{{ plex_preferences_path }}"
  when: plex_preferences_need_lan_update

- name: Claim Plex Media Server when PLEX_CLAIM_TOKEN is provided
  ansible.builtin.shell:
    cmd: |
      set -eu

      pref='{{ plex_preferences_path }}'
      claim_token="$PLEX_CLAIM_TOKEN"

      if grep -q 'PlexOnlineToken=' "$pref"; then
        exit 0
      fi

      client_id="$(sed -n 's/.*ProcessedMachineIdentifier="\([^"]*\)".*/\1/p' "$pref")"
      login_info="$(curl --fail --silent --show-error --request POST \
        --header "X-Plex-Client-Identifier: ${client_id}" \
        --header 'X-Plex-Product: Plex Media Server' \
        --header 'X-Plex-Version: 1.1' \
        --header 'X-Plex-Provides: server' \
        --header 'X-Plex-Platform: Linux' \
        --header 'X-Plex-Platform-Version: 1.0' \
        --header 'X-Plex-Device-Name: PlexMediaServer' \
        --header 'X-Plex-Device: Linux' \
        "https://plex.tv/api/claim/exchange?token=${claim_token}")"
      server_token="$(printf '%s' "$login_info" | sed -n 's/.*<authentication-token>\(.*\)<\/authentication-token>.*/\1/p')"

      test -n "$server_token"
      perl -0pi -e "s/\sPlexOnlineToken=\"[^\"]*\"//g; s/<Preferences\b([^>]*)\/>/<Preferences\$1 PlexOnlineToken=\"$server_token\"\/>/;" "$pref"

    executable: /bin/sh
  environment:
    PLEX_CLAIM_TOKEN: "{{ plex_claim_token }}"
  no_log: true
  when: plex_preferences_need_claim

- name: Ensure Plex Media Server is running after configuration
  ansible.builtin.service:
    name: plexmediaserver
    state: started
    enabled: true
