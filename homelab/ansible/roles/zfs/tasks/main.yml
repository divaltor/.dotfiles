---
# ZFS role — manage datasets on Proxmox host

- name: Check ZFS pool exists
  ansible.builtin.command:
    cmd: "zpool list -H -o name {{ zfs_pool_name }}"
  register: zpool_check
  changed_when: false
  failed_when: false

- name: Import the existing HDD ZFS pool after host replacement
  ansible.builtin.command:
    argv: [zpool, import, -f, "{{ zfs_pool_name }}"]
  register: zpool_import
  failed_when: false
  when: zpool_check.rc != 0

- name: Verify the HDD ZFS pool is imported
  ansible.builtin.command:
    argv: [zpool, list, -H, -o, name, "{{ zfs_pool_name }}"]
  register: zpool_imported
  changed_when: false
  failed_when: false

- name: Fail if ZFS pool not found
  ansible.builtin.fail:
    msg: "ZFS pool '{{ zfs_pool_name }}' not found on host"
  when: zpool_imported.rc != 0

- name: Ensure ZFS datasets exist
  ansible.builtin.command:
    cmd: "zfs list -H -o name {{ item.name }}"
  register: zfs_dataset_check
  changed_when: false
  failed_when: false
  loop: "{{ zfs_datasets }}"

- name: Fail if configured ZFS datasets are missing
  ansible.builtin.fail:
    msg: "ZFS dataset '{{ item.item.name }}' is missing; create or import storage manually before running Ansible"
  when: item.rc != 0
  loop: "{{ zfs_dataset_check.results }}"

- name: Read ZFS dataset mountpoints
  ansible.builtin.command:
    argv: [zfs, get, -H, -o, value, mountpoint, "{{ item.name }}"]
  loop: "{{ zfs_datasets }}"
  register: zfs_dataset_mountpoints
  changed_when: false

- name: Ensure ZFS dataset mountpoints match config
  ansible.builtin.command:
    argv: [zfs, set, "mountpoint={{ item.item.mountpoint }}", "{{ item.item.name }}"]
  loop: "{{ zfs_dataset_mountpoints.results }}"
  when: item.stdout != item.item.mountpoint

- name: Show ZFS pool status
  ansible.builtin.command:
    cmd: "zpool status {{ zfs_pool_name }}"
  register: zpool_status
  changed_when: false

- name: Display ZFS pool status
  ansible.builtin.debug:
    var: zpool_status.stdout_lines

# ARC sizing. Persisted in modprobe config for boot, and applied live so no
# reboot is required.
- name: Ensure ZFS ARC max is configured
  ansible.builtin.lineinfile:
    path: /etc/modprobe.d/zfs.conf
    regexp: '^options zfs zfs_arc_max='
    line: 'options zfs zfs_arc_max={{ zfs_arc_max_bytes }}'
    create: true
    mode: '0644'
  notify: Rebuild initramfs for ZFS module options

- name: Read live ZFS ARC max
  ansible.builtin.command:
    cmd: cat /sys/module/zfs/parameters/zfs_arc_max
  register: zfs_arc_max_live
  changed_when: false

- name: Apply ZFS ARC max without reboot
  ansible.builtin.shell: "echo {{ zfs_arc_max_bytes }} > /sys/module/zfs/parameters/zfs_arc_max"
  when: zfs_arc_max_live.stdout | trim != (zfs_arc_max_bytes | string)

- name: Verify live ZFS ARC max
  ansible.builtin.command:
    cmd: cat /sys/module/zfs/parameters/zfs_arc_max
  register: zfs_arc_max_applied
  changed_when: false
  failed_when: zfs_arc_max_applied.stdout | trim != (zfs_arc_max_bytes | string)
