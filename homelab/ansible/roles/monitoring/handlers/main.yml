---
- name: Reload monitoring systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Prometheus
  ansible.builtin.service:
    name: prometheus
    state: restarted

- name: Restart Proxmox exporter
  ansible.builtin.service:
    name: prometheus-pve-exporter
    state: restarted

- name: Restart Grafana
  ansible.builtin.service:
    name: grafana-server
    state: restarted

- name: Restart Loki
  ansible.builtin.service:
    name: loki
    state: restarted

- name: Restart Tempo
  ansible.builtin.service:
    name: tempo
    state: restarted

- name: Restart Alloy
  ansible.builtin.service:
    name: alloy
    state: restarted
