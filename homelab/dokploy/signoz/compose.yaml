# Generated by SigNoz Foundry and adapted into one Dokploy-ready Compose file.
networks:
  signoz-network: {}
  dokploy-network:
    external: true
services:
  ingester:
    command:
    - -c
    - |
      /signoz-otel-collector migrate sync check &&
      /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/opamp-config.yaml --copy-path=/var/tmp/collector-config.yaml
    deploy:
      replicas: 1
    entrypoint:
    - /bin/sh
    environment:
    - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
    - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    - SIGNOZ_OTLP_TOKEN=${SIGNOZ_OTLP_TOKEN:?SIGNOZ_OTLP_TOKEN is required}
    - LOW_CARDINAL_EXCEPTION_GROUPING=false
    image: signoz/signoz-otel-collector:latest
    networks:
      signoz-network:
        aliases:
        - signoz-ingester
    ports:
    - 4317:4317
    - 4318:4318
    restart: unless-stopped
    configs:
    - source: ingester-config
      target: /etc/otel-collector-config.yaml
    - source: opamp-config
      target: /etc/opamp-config.yaml
  signoz-metastore-postgres-0:
    environment:
    - POSTGRES_DB=signoz
    - POSTGRES_PASSWORD=signoz
    - POSTGRES_USER=signoz
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD-SHELL
      - pg_isready -U signoz -d signoz
      timeout: 10s
    image: postgres:16
    networks:
    - signoz-network
    restart: unless-stopped
    volumes:
    - signoz-metastore-postgres-0-data:/var/lib/postgresql/data
  signoz-signoz-0:
    environment:
    - SIGNOZ_SQLSTORE_POSTGRES_DSN=postgres://signoz:signoz@signoz-metastore-postgres-0:5432/signoz?sslmode=disable
    - SIGNOZ_SQLSTORE_PROVIDER=postgres
    - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
    - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
    - SIGNOZ_TOKENIZER_JWT_SECRET=${SIGNOZ_TOKENIZER_JWT_SECRET:?SIGNOZ_TOKENIZER_JWT_SECRET is required}
    - SIGNOZ_PROMETHEUS_ACTIVE__QUERY__TRACKER_PATH=/tmp/signoz-active-queries
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8080/api/v1/health
      timeout: 10s
    image: signoz/signoz:latest
    networks:
    - signoz-network
    - dokploy-network
    expose:
    - "8080"
    restart: unless-stopped
  signoz-telemetrykeeper-clickhousekeeper-0:
    entrypoint:
    - /usr/bin/clickhouse-keeper
    - --config-file=/etc/clickhouse-keeper/keeper.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - clickhouse-keeper-client
      - -h
      - localhost
      - -p
      - "9181"
      - -q
      - ls
      timeout: 10s
    image: clickhouse/clickhouse-keeper:25.12.5
    networks:
    - signoz-network
    restart: unless-stopped
    volumes:
    - signoz-telemetrykeeper-0-data:/var/lib/clickhouse-keeper
    configs:
    - source: keeper-config
      target: /etc/clickhouse-keeper/keeper.yaml
  signoz-telemetrystore-clickhouse-0-0:
    depends_on:
      signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1
    - CLICKHOUSE_CONFIG=/etc/clickhouse-server/config-0-0.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8123/ping
      timeout: 10s
    image: clickhouse/clickhouse-server:25.12.5
    networks:
    - signoz-network
    restart: unless-stopped
    volumes:
    - signoz-telemetrystore-0-0-data:/var/lib/clickhouse
    - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts:ro
    configs:
    - source: clickhouse-config
      target: /etc/clickhouse-server/config-0-0.yaml
    - source: clickhouse-functions
      target: /etc/clickhouse-server/functions.yaml
  signoz-telemetrystore-clickhouse-user-scripts:
    command:
    - bash
    - -c
    - |-
      version="v0.0.1"
      node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
      node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
      echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
      cd /tmp
      wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
      tar -xvzf histogram-quantile.tar.gz
      mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    image: clickhouse/clickhouse-server:25.12.5
    networks:
    - signoz-network
    restart: on-failure
    volumes:
    - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts
  signoz-telemetrystore-migrator:
    command:
    - -c
    - |
      /signoz-otel-collector migrate ready &&
      /signoz-otel-collector migrate bootstrap &&
      /signoz-otel-collector migrate sync up &&
      /signoz-otel-collector migrate async up
    entrypoint:
    - /bin/sh
    environment:
    - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
    - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    image: signoz/signoz-otel-collector:latest
    networks:
    - signoz-network
    restart: on-failure
volumes:
  signoz-metastore-postgres-0-data:
  signoz-telemetrykeeper-0-data:
  signoz-telemetrystore-0-0-data:
  signoz-telemetrystore-user-scripts:
configs:
  ingester-config:
    content: |
      connectors:
        signozmeter:
          dimensions:
          - name: service.name
          - name: deployment.environment
          - name: host.name
          metrics_flush_interval: 1h
      exporters:
        clickhouselogsexporter:
          dsn: tcp://signoz-telemetrystore-clickhouse-0-0:9000/signoz_logs
          sending_queue:
            enabled: false
          timeout: 45s
          use_new_schema: true
        clickhousetraces:
          datasource: tcp://signoz-telemetrystore-clickhouse-0-0:9000/signoz_traces
          low_cardinal_exception_grouping: $${env:LOW_CARDINAL_EXCEPTION_GROUPING}
          sending_queue:
            enabled: false
          timeout: 45s
          use_new_schema: true
        metadataexporter:
          cache:
            provider: in_memory
          dsn: tcp://signoz-telemetrystore-clickhouse-0-0:9000/signoz_metadata
          enabled: true
          timeout: 45s
        signozclickhousemeter:
          dsn: tcp://signoz-telemetrystore-clickhouse-0-0:9000/signoz_meter
          sending_queue:
            enabled: false
          timeout: 45s
        signozclickhousemetrics:
          dsn: tcp://signoz-telemetrystore-clickhouse-0-0:9000/signoz_metrics
          sending_queue:
            enabled: false
          timeout: 45s
      extensions:
        bearertokenauth/otlp:
          token: $${env:SIGNOZ_OTLP_TOKEN}
        pprof:
          endpoint: 0.0.0.0:1777
        signoz_health_check:
          endpoint: 0.0.0.0:13133
      processors:
        batch:
          send_batch_max_size: 55000
          send_batch_size: 50000
          timeout: 5s
        batch/meter:
          send_batch_max_size: 25000
          send_batch_size: 20000
          timeout: 5s
        signozspanmetrics/delta:
          aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
          dimensions:
          - default: default
            name: service.namespace
          - default: default
            name: deployment.environment
          - name: signoz.collector.id
          - name: service.version
          dimensions_cache_size: 100000
          enable_exp_histogram: true
          latency_histogram_buckets:
          - 100us
          - 1ms
          - 2ms
          - 6ms
          - 10ms
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1000ms
          - 1400ms
          - 2000ms
          - 5s
          - 10s
          - 20s
          - 40s
          - 60s
          metrics_exporter: signozclickhousemetrics
          metrics_flush_interval: 60s
      receivers:
        otlp:
          protocols:
            grpc:
              auth:
                authenticator: bearertokenauth/otlp
              endpoint: 0.0.0.0:4317
            http:
              auth:
                authenticator: bearertokenauth/otlp
              endpoint: 0.0.0.0:4318
      service:
        extensions:
        - bearertokenauth/otlp
        - signoz_health_check
        - pprof
        pipelines:
          logs:
            exporters:
            - clickhouselogsexporter
            - signozmeter
            - metadataexporter
            processors:
            - batch
            receivers:
            - otlp
          metrics:
            exporters:
            - signozclickhousemetrics
            - signozmeter
            - metadataexporter
            processors:
            - batch
            receivers:
            - otlp
          metrics/meter:
            exporters:
            - signozclickhousemeter
            processors:
            - batch/meter
            receivers:
            - signozmeter
          traces:
            exporters:
            - clickhousetraces
            - signozmeter
            - metadataexporter
            processors:
            - signozspanmetrics/delta
            - batch
            receivers:
            - otlp
        telemetry:
          logs:
            encoding: json
  opamp-config:
    content: |
      server_endpoint: ws://signoz-signoz-0:4320/v1/opamp
  keeper-config:
    content: |
      keeper_server:
        coordination_settings:
          force_sync: false
          operation_timeout_ms: 10000
          raft_logs_level: warning
          session_timeout_ms: 30000
          snapshot_distance: 100000
          snapshots_to_keep: 3
        four_letter_word_white_list: '*'
        log_storage_path: /var/lib/clickhouse-keeper/coordination/log
        raft_configuration:
          server:
          - hostname: signoz-telemetrykeeper-clickhousekeeper-0
            id: 0
            port: 9234
        server_id: 0
        snapshot_storage_path: /var/lib/clickhouse-keeper/coordination/snapshots
        tcp_port: 9181
      listen_host: 0.0.0.0
      logger:
        console: true
        level: information
  clickhouse-config:
    content: |
      asynchronous_metric_log:
        ttl: event_date + INTERVAL 1 DAY DELETE
      dictionaries_config: '*_dictionary.xml'
      display_name: cluster
      distributed_ddl:
        path: /clickhouse/task_queue/ddl
      error_log:
        ttl: event_date + INTERVAL 1 DAY DELETE
      format_schema_path: /var/lib/clickhouse/format_schemas/
      http_port: 8123
      interserver_http_port: 9009
      latency_log:
        ttl: event_date + INTERVAL 1 DAY DELETE
      listen_host: 0.0.0.0
      logger:
        console: 1
        count: 10
        formatting:
          type: console
        level: information
        size: 1000M
      macros:
        replica: "00"
        shard: "00"
      metric_log:
        flush_interval_milliseconds: 30000
        ttl: event_date + INTERVAL 1 DAY DELETE
      part_log:
        ttl: event_date + INTERVAL 1 DAY DELETE
      path: /var/lib/clickhouse/
      processors_profile_log:
        flush_interval_milliseconds: 30000
        ttl: event_date + INTERVAL 1 DAY DELETE
      profiles:
        default:
          allow_simdjson: 0
          load_balancing: random
          log_queries: 1
      query_log:
        flush_interval_milliseconds: 30000
        partition_by: toYYYYMM(event_date)
        ttl: event_date + INTERVAL 1 DAY DELETE
      query_metric_log:
        ttl: event_date + INTERVAL 1 DAY DELETE
      query_thread_log:
        ttl: event_date + INTERVAL 1 DAY DELETE
      query_views_log:
        ttl: event_date + INTERVAL 1 DAY DELETE
      quotas:
        default:
          interval:
            duration: 3600
            errors: 0
            execution_time: 0
            queries: 0
            read_rows: 0
            result_rows: 0
      remote_servers:
        cluster:
          shard:
          - replica:
            - host: signoz-telemetrystore-clickhouse-0-0
              port: 9000
      session_log:
        ttl: event_date + INTERVAL 1 DAY DELETE
      tcp_port: 9000
      text_log:
        flush_interval_milliseconds: 30000
        ttl: event_date + INTERVAL 1 DAY DELETE
      tmp_path: /var/lib/clickhouse/tmp/
      trace_log:
        flush_interval_milliseconds: 30000
        ttl: event_date + INTERVAL 1 DAY DELETE
      user_defined_executable_functions_config: '*functions.yaml'
      user_directories:
        users_xml:
          path: config-0-0.yaml
      user_files_path: /var/lib/clickhouse/user_files/
      user_scripts_path: /var/lib/clickhouse/user_scripts/
      users:
        default:
          access_management: 1
          named_collection_control: 1
          networks:
            ip: ::/0
          password: ""
          profile: default
          quota: default
          show_named_collection: 1
          show_named_collection_secrets: 1
      zookeeper:
        node:
        - host: signoz-telemetrykeeper-clickhousekeeper-0
          port: 9181
      zookeeper_log:
        ttl: event_date + INTERVAL 1 DAY DELETE
  clickhouse-functions:
    content: |
      functions:
        argument:
        - name: buckets
          type: Array(Float64)
        - name: counts
          type: Array(Float64)
        - name: quantile
          type: Float64
        command: ./histogramQuantile
        format: CSV
        name: histogramQuantile
        return_type: Float64
        type: executable
