<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('file://{{FONTS}}/Inter.ttf'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url('file://{{FONTS}}/GeistMono.ttf'); }

  :root {
    --bg: oklch(99.3% 0.002 80);
    --surface: oklch(96.8% 0.003 80);
    --line: oklch(91.5% 0.004 80);
    --context: oklch(76% 0.006 80);
    --muted: oklch(47% 0.008 80);
    --ink: oklch(20% 0.005 80);
    --accent: oklch(55% 0.19 256);
    --worse: oklch(55% 0.2 27);
    --sans: 'Inter', sans-serif;
    --mono: 'Geist Mono', monospace;
    --label: 240px;
    --end: 140px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-optical-sizing: auto; font-synthesis: none; -webkit-font-smoothing: antialiased; padding: 64px 72px 56px; }
  code, .id { font-family: var(--mono); font-weight: 450; font-size: 0.94em; font-feature-settings: 'calt' 0, 'liga' 0, 'dlig' 0; }

  .chart + .chart { margin-top: 80px; padding-top: 64px; border-top: 1px solid var(--line); }
  h1 { font: 600 34px/1.15 var(--sans); letter-spacing: -0.022em; text-wrap: balance; }
  .sub { font: 400 19px/1.45 var(--sans); letter-spacing: -0.011em; color: var(--muted); margin-top: 8px; text-wrap: pretty; }

  .plot { position: relative; margin-top: 40px; font-variant-numeric: tabular-nums; }
  .grid { position: absolute; top: 0; bottom: 32px; left: var(--label); right: var(--end); pointer-events: none; }
  .grid div { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); }
  .group { font: 500 17px/1 var(--sans); padding: 20px 0 10px; position: relative; width: fit-content; background: var(--bg); padding-right: 12px; }
  .group:first-child { padding-top: 0; }
  .row { display: grid; grid-template-columns: var(--label) 1fr var(--end); align-items: center; height: 48px; position: relative; }
  .row .name { font: 400 17px/1.2 var(--sans); color: var(--muted); padding-right: 16px; }
  .row .name .id { color: var(--ink); }
  .track { position: relative; height: 100%; }
  .bar { position: absolute; top: 8px; height: 32px; border-radius: 4px; border: 1.25px solid currentColor; }
  .bar.named { border-width: 1.5px; background: color-mix(in oklch, currentColor 7.5%, transparent); }
  .vacated { position: absolute; top: 8px; height: 32px; border-radius: 4px; border: 1.25px dashed currentColor; overflow: hidden; }
  .vacated svg { display: block; width: 100%; height: 100%; }
  .projection { position: absolute; top: -8px; height: 8px; border-left: 1px solid color-mix(in oklch, var(--ink) 18%, transparent); }
  .val { position: absolute; top: 50%; transform: translateY(-50%); font: 500 17px/1 var(--sans); white-space: nowrap; background: var(--bg); padding: 4px; }
  .val em { font-style: normal; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .val em.worse { color: var(--worse); }
  .key { position: relative; height: 28px; margin-left: var(--label); margin-right: var(--end); font: 500 15px/1 var(--sans); }
  .key span { position: absolute; top: 0; white-space: nowrap; background: var(--bg); padding-right: 6px; }
  .axis { position: relative; height: 32px; margin-left: var(--label); margin-right: var(--end); font: 400 15px/1 var(--sans); color: var(--muted); }
  .axis span { position: absolute; top: 12px; transform: translateX(-50%); white-space: nowrap; }
  .axis span:first-child { transform: none; }
  .note { font: 400 16px/1.5 var(--sans); color: var(--muted); margin-top: 24px; max-width: 70ch; text-wrap: pretty; }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
  <defs><pattern id="stacked-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="var(--accent)" stroke-width="1.25" stroke-opacity="0.22"/></pattern></defs>
</svg>
<main id="charts"></main>

<script>
// Example values: the reduction and stacked charts come from a past memory PR, the bars from counting
// DAG files per team in this repo. Replace every value with measured numbers you can point to.
// reduction: outlined before/after bars on a zero-based axis; repeat rows for several items.
// stacked: parts of a total per row; bar length encodes size, so the domain starts at 0.
//          Put the part the claim is about first: only the first part has a common baseline.
// bars: one value per item, sorted, value at the bar end, no axis. `highlight` marks what the title names.
// better: 'lower' (default) or 'higher' decides when a reduction-chart delta is drawn in --worse.
// Each entry is one image. Keep only the entries you need; to render one entry of several, open the page
// with ?chart=<type> or ?chart=<position from 1>, which keeps the full padded canvas.
const DATA = [
  {
    type: 'reduction',
    title: 'Deferring imports cut sampled task-process RSS by 32%',
    sub: 'Task process RSS after parsing the DAG file in a worker pod',
    unit: 'MB', domain: [0, 450], ticks: [0, 150, 300, 450],
    rows: [
      { name: '40 sampled DAG files, median', before: 339, after: 230 },
      { name: 'bilayer_prospector_daily_usage_report', id: true, before: 371, after: 194 },
      { name: 'events_cdc', id: true, before: 340, after: 206 },
      { name: 'test_node_selector', id: true, before: 361, after: 263 },
    ],
    note: 'one parse per file for the sample, medians of five runs for named DAGs; hatched spans show the measured reduction, not work removed from task execution.',
  },
  {
    type: 'stacked',
    title: 'Both changes together cut task pod memory by 29% to 39%',
    sub: 'Pod memory (PSS of the task and supervisor processes), prod image, prod DAG config',
    unit: 'MB', domain: [0, 500], ticks: [0, 250, 500],
    series: [{ name: 'Task process', color: 'var(--accent)' }, { name: 'Supervisor', color: 'var(--context)' }],
    groups: [
      { name: 'events_cdc (Spoor ETL)', rows: [
        { name: 'before', parts: [303, 106] },
        { name: 'after', parts: [167, 106], delta: -136 },
        { name: 'after + gc.freeze', parts: [156, 95], delta: -158 },
      ] },
      { name: 'S3 to Redshift ingester (ETLReusableDAG)', rows: [
        { name: 'before', parts: [386, 106] },
        { name: 'after', parts: [266, 105], delta: -121 },
        { name: 'after + gc.freeze', parts: [255, 95], delta: -142 },
      ] },
    ],
    note: 'Both run a full GC before PSS is read from <code>smaps_rollup</code>. Without the freeze, repeated runs ranged up to 26 MB higher.',
  },
  {
    type: 'bars',
    title: 'Two teams own 543 of the 712 DAG files, 76%',
    sub: 'Python files under each team folder that construct a DAG',
    items: [
      { name: 'biteam', id: true, value: 293, highlight: true },
      { name: 'dataplatform', id: true, value: 250, highlight: true },
      { name: 'ftspecialist', id: true, value: 85 },
      { name: 'martech', id: true, value: 43 },
      { name: 'Six other teams', value: 41, rest: true },
    ],
    note: 'Counted by matching <code>FTDAG</code> or <code>DAG(</code>, so a file with two DAGs counts once.',
  },
]

const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e }
const pct = (c, v) => ((v - c.domain[0]) / (c.domain[1] - c.domain[0])) * 100
const signed = d => (d < 0 ? '\u2212' + -d : '+' + d)
const isWorse = (c, d) => (c.better === 'higher' ? d < 0 : d > 0)
const label = r => (r.id ? `<span class="id">${r.name}</span>` : r.name)
const textColor = color => (color === 'var(--context)' ? 'var(--muted)' : color)

function axis(c, plot) {
  const grid = el('div', 'grid'), ax = el('div', 'axis')
  c.ticks.forEach((t, i) => {
    if (i > 0) { const g = el('div'); g.style.left = pct(c, t) + '%'; grid.append(g) }
    const s = el('span', '', i === c.ticks.length - 1 ? `${t} ${c.unit}` : t); s.style.left = pct(c, t) + '%'; ax.append(s)
  })
  plot.prepend(grid); plot.append(ax)
}

function stackedKey(c, r) {
  const key = el('div', 'key')
  let x = 0
  r.parts.forEach((v, i) => {
    const s = el('span', '', c.series[i].name); s.style.left = pct(c, x) + '%'; s.style.color = textColor(c.series[i].color)
    key.append(s); x += v
  })
  return key
}

function stackedRow(c, r, baseline) {
  const row = el('div', 'row'), track = el('div', 'track')
  row.append(el('div', 'name', label(r)), track, el('div'))
  let x = 0
  r.parts.forEach((v, i) => {
    const b = el('div', 'bar' + (r !== baseline && i === 0 ? ' named' : '')); b.style.left = pct(c, x) + '%'; b.style.width = `calc(${pct(c, v) - pct(c, 0)}% - 2px)`
    b.style.color = r === baseline ? 'var(--context)' : c.series[i].color; track.append(b); x += v
  })
  const before = baseline.parts.reduce((sum, v) => sum + v, 0)
  if (x < before) {
    const span = el('div', 'vacated', '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" preserveAspectRatio="xMinYMid slice"><rect width="100%" height="100%" fill="url(#stacked-hatch)"/></svg>')
    span.style.left = pct(c, x) + '%'; span.style.width = pct(c, before) - pct(c, x) + '%'; span.style.color = 'var(--accent)'; track.append(span)
  }
  if (r !== baseline) {
    const guide = el('div', 'projection'); guide.style.left = pct(c, before) + '%'; track.append(guide)
  }
  const delta = r.delta ? `<em class="${isWorse(c, r.delta) ? 'worse' : ''}">${signed(r.delta)}</em>` : ''
  const v = el('div', 'val', `${x} ${c.unit}${delta}`); v.style.left = `calc(${pct(c, Math.max(x, before))}% + 8px)`; track.append(v)
  return row
}

function barsRow(c, r, max) {
  const row = el('div', 'row'), track = el('div', 'track')
  row.append(el('div', 'name', label(r)), track, el('div'))
  const w = (r.value / max) * 100
  const b = el('div', 'bar' + (r.highlight ? ' named' : '')); b.style.left = 0; b.style.width = w + '%'; b.style.color = r.highlight ? 'var(--accent)' : 'var(--context)'; track.append(b)
  const v = el('div', 'val', r.value); v.style.left = `calc(${w}% + 8px)`; if (r.rest) v.style.color = 'var(--muted)'; track.append(v)
  return row
}

function reductionChart(c) {
  if (c.domain[0] !== 0) throw new Error('Reduction bars require a zero-based domain')
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  const left = 180, width = 620, pitch = 184, height = c.rows.length * pitch + 32
  const x = value => left + value / c.domain[1] * width
  const fmt = value => Number(value.toFixed(1)).toLocaleString('en-US')
  const patternId = 'reduction-hatch-' + document.querySelectorAll('section.chart').length
  svg.setAttribute('viewBox', `0 0 936 ${height}`)
  svg.setAttribute('role', 'img')
  svg.setAttribute('aria-label', c.title)
  svg.style.cssText = 'display:block;width:100%;height:auto;font-variant-numeric:tabular-nums'
  let shapes = `<defs><pattern id="${patternId}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1" opacity="0.22"/></pattern></defs>`
  const text = (px, py, value, color = 'var(--muted)', anchor = 'start', weight = 400) => `<text x="${px}" y="${py}" fill="${color}" text-anchor="${anchor}" font-size="16" font-weight="${weight}" style="paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round">${value}</text>`
  c.ticks.forEach(tick => {
    c.rows.forEach((r, i) => {
      if (tick <= Math.max(r.before, r.after)) shapes += `<line x1="${x(tick)}" x2="${x(tick)}" y1="${i * pitch + 34}" y2="${i * pitch + 138}" stroke="var(--line)" stroke-width="1"/>`
    })
    shapes += text(x(tick), height - 8, tick === c.ticks.at(-1) ? `${fmt(tick)} ${c.unit}` : fmt(tick), 'var(--muted)', tick === 0 ? 'start' : 'middle')
  })
  c.rows.forEach((r, i) => {
    const top = i * pitch, beforeY = top + 48, afterY = top + 98, barHeight = 32
    const delta = Number((r.after - r.before).toFixed(1)), worse = isWorse(c, delta)
    const color = worse ? 'var(--worse)' : 'var(--accent)'
    const endpoint = x(Math.max(r.before, r.after)), low = x(Math.min(r.before, r.after))
    shapes += `<g${r.id ? ' class="id"' : ''}>${text(0, top + 20, r.name, 'var(--ink)', 'start', 500)}</g>`
    shapes += text(0, beforeY + 22, 'before') + text(0, afterY + 22, 'after', color, 'start', 500)
    shapes += `<rect x="${left}" y="${beforeY}" width="${x(r.before) - left}" height="${barHeight}" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.25" stroke-opacity="0.45"/>`
    shapes += `<line x1="${x(r.before)}" x2="${x(r.before)}" y1="${beforeY + barHeight + 8}" y2="${afterY - 8}" stroke="var(--ink)" stroke-opacity="0.18"/>`
    shapes += `<rect x="${left}" y="${afterY}" width="${x(r.after) - left}" height="${barHeight}" rx="4" fill="${color}" fill-opacity="0.075" stroke="${color}" stroke-width="1.5"/>`
    if (delta !== 0) {
      const hatchY = worse ? beforeY : afterY
      shapes += `<rect x="${low}" y="${hatchY}" width="${endpoint - low}" height="${barHeight}" rx="4" fill="url(#${patternId})" color="${color}" stroke="${color}" stroke-opacity="0.55" stroke-width="1.25" stroke-dasharray="4 5"/>`
    }
    shapes += text(endpoint + 16, beforeY + 22, `${fmt(r.before)} ${c.unit}`)
    shapes += text(endpoint + 16, afterY + 22, `${fmt(r.after)} ${c.unit}`, color, 'start', 500)
    const percent = (r.after / r.before - 1) * 100
    shapes += text(endpoint, afterY + 62, `${signed(delta)} ${c.unit} (${percent < 0 ? '−' : '+'}${fmt(Math.abs(percent))}%)`, color, 'end', 500)
  })
  svg.innerHTML = shapes
  return svg
}

const only = new URLSearchParams(location.search).get('chart')
const shown = only == null ? DATA : DATA.filter((c, i) => c.type === only || String(i + 1) === only)
if (!shown.length) throw new Error(`no chart matches ?chart=${only}`)
const root = document.getElementById('charts')
for (const c of shown) {
  const sec = el('section', 'chart')
  sec.append(el('h1', '', c.title), el('p', 'sub', c.sub))
  const plot = el('div', 'plot ' + c.type)
  if (c.type === 'reduction') {
    plot.append(reductionChart(c))
  } else if (c.type === 'stacked') {
    c.groups.forEach((g, i) => {
      plot.append(el('div', 'group', g.name))
      if (i === 0) plot.append(stackedKey(c, g.rows[0]))
      g.rows.forEach(r => plot.append(stackedRow(c, r, g.rows[0])))
    })
    axis(c, plot)
  } else {
    const items = [...c.items.filter(r => !r.rest).sort((a, b) => b.value - a.value), ...c.items.filter(r => r.rest)]
    const max = Math.max(...items.map(r => r.value))
    items.forEach(r => plot.append(barsRow(c, r, max)))
  }
  sec.append(plot)
  if (c.note) sec.append(el('p', 'note', c.note))
  root.append(sec)
}

document.fonts.ready.then(() => {
  // Hatch at 1:1 pixels, so every reduction span has the same line weight and pitch.
  document.querySelectorAll('.vacated svg').forEach(s => s.setAttribute('viewBox', `0 0 ${s.clientWidth} ${s.clientHeight}`))
  document.body.dataset.fonts = document.fonts.check('16px "Inter"') && document.fonts.check('16px "Geist Mono"')
  document.body.dataset.height = Math.ceil(document.body.getBoundingClientRect().height)
})
</script>
</body>
</html>
